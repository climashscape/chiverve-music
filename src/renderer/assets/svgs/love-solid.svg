  <!--! 实心心形（「已在我喜欢里」用）。图元就是空心版 #icon-love（components/layout/Icons.vue）的
        **外轮廓子路径**，viewBox 与原坐标都不动：两态同一副剪影，切换时不会跳尺寸、不会错位。
